<section class="admin-products">
    <h2>Administration</h2>
    <h3>Produkter</h3>

    <table>
        <thead>
            <tr>
                <th>Namn</th>
                <th>SKU</th>
                <th>Pris</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (product of products(); track product.id) {
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.sku }}</td>
                    <td>{{ product.price }}</td>
                    <td>
                        <button (click)="onDelete(product.id)" aria-label="Ta bort">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            }
        </tbody>
    </table>

    <a routerLink="/admin/products/new" class="new-product-button">Ny produkt</a>
</section>
